    const starIcon = (pay, color) => {

        <svg class="star-main" viewBox="0 0 44 44" width="44" height="44" style="animation-delay:${delay}s">

              <stop offset="35%" stop-color="#ffe566"/>

              <stop offset="100%" stop-color="#e6a800"/>

    const colors = { gas: "#4cc3ff", av: "#7dff8a", ref: "#ff9a4a", lav: "#c77dff" };

    function showMenu() {
      document.getElementById("grid").style.display = "none";

    function openCategory(catId) {
      document.getElementById("menu").style.display = "none";

            <span class="pay">${money(item.pay)}</span>
          </div>
          ${starIcon(item.pay, colors[item.cat])}

      `).join("");
      grid.querySelectorAll(".card").forEach((card) => {
        card.onclick = () => openSheet(Number(card.dataset.id));

    }



    function openSheet(id) {
      const item = data.find((d) => d.id === id);
      const sheet = document.getElementById("sheet");
      document.getElementById("panel").innerHTML = `

        <h2>${item.name}</h2>
        <div class="badge">${item.catName.toUpperCase()}</div>
        <div class="big" style="color:${colors[item.cat]}">${money(item.pay)}</div>
        <p class="hint"><strong>Condición:</strong> ${item.cond}</p>
        <p class="hint" style="margin-top:8px">${item.note}</p>
        <p class="hint" style="margin-top:10px">Fuente: brief de incentivos septiembre 2026. El valor es el incentivo por cumplimiento, no una meta de ventas.</p>
        <button class="close" style="background:${colors[item.cat]};color:#06111f">Cerrar</button>
      `;
      sheet.classList.add("open");
      sheet.querySelector(".close").onclick = () => sheet.classList.remove("open");
      sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("open"); };
    }

      const sheet = document.getElementById("sheet");
      document.getElementById("panel").innerHTML = `

        <ol style="color: var(--muted); font-size: 13px; line-height: 1.5; padding-left: 18px; text-align: left; display: flex; flex-direction: column; gap: 10px;">
          <li>Acumula puntos a partir de 6 unidades participantes.</li>
          <li>Los puntos especiales solo aplican si se cumple el mínimo de 6 Und de la categoría y las mismas unidades en televisión y campanas.</li>
          <li>Aplica solo para las referencias publicadas en esta pieza.</li>
          <li>Aplica a partir del 1 al 30 de Septiembre del 2026.</li>
          <li>No válido para ventas mayoristas, ni institucionales.</li>
          <li>No acumulan puntos el personal administrativo, bodegueros, dueños, administradores de los almacenes.</li>
          <li>Se puede acumular puntos por máximo 40 unidades por vendedor en la liquidación.</li>
          <li>En caso de encontrar inconsistencia en los reportes, se sanciona la cuenta por 3 meses, es decir, no se acumularán puntos durante ese periodo.</li>
          <li>Los reportes deberán ser enviados por la gerencia de cuenta o administradores de punto de venta, estos deben ser enviados a más tardar el día 5 luego de finalizado el periodo a reportar.</li>
          <li>Los clientes tienen máximo hasta la siguiente liquidación para reportar cualquier reclamación respecto al plan, este deberá reportarse en el formato diseñado para tal fin. No se aceptará ninguna excepción por ningún concepto.</li>
          <li>Aplica términos y condiciones de plataforma JUJU.</li>
          <li>La acumulación de puntos bajo esta dinámica no representa ninguna relación entre Challenger y los ganadores de los puntos, más allá de la relación comercial con el cliente.</li>
        </ol>
        <button class="close" style="background:var(--blue);color:#06111f;margin-top:20px;">Cerrar</button>
      `;
      sheet.classList.add("open");
      sheet.querySelector(".close").onclick = () => sheet.classList.remove("open");
      sheet.onclick = (e) => { if (e.target === sheet) sheet.classList.remove("open"); };
    }

    let currentSlide = 0;
    let carouselInterval;

    function initCarousel() {
      const track = document.getElementById("carouselTrack");
      const indicators = document.getElementById("carouselIndicators");
      const slides = track.querySelectorAll(".carousel-slide");
      const totalSlides = slides.length;

      // Crear indicadores
      indicators.innerHTML = "";
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement("div");
        dot.className = "carousel-dot" + (i === 0 ? " active" : "");
        dot.onclick = () => goToSlide(i);
        indicators.appendChild(dot);
      }

      // Limpiar intervalo anterior si existe
      if (carouselInterval) clearInterval(carouselInterval);

      // Iniciar autoplay
      carouselInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        updateCarousel();
      }, 3000);

      function updateCarousel() {
        track.style.transform = `translateX(-${currentSlide * 100}%)`;
        const dots = indicators.querySelectorAll(".carousel-dot");
        dots.forEach((dot, index) => {
          dot.classList.toggle("active", index === currentSlide);
        });
      }

      function goToSlide(index) {
        currentSlide = index;
        updateCarousel();
        // Reiniciar el intervalo al hacer clic manual
        clearInterval(carouselInterval);
        carouselInterval = setInterval(() => {
          currentSlide = (currentSlide + 1) % totalSlides;
          updateCarousel();
        }, 3000);
      }
    }

    showMenu();
  </script>
